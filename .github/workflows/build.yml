name: Build MAFX SHARE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          test -f mafx_share.zip || (echo "mafx_share.zip not found" && exit 1)
          rm -rf app
          unzip -o mafx_share.zip -d app
          test -f app/ci_build.sh || (echo "OLD ZIP: ci_build.sh is missing, upload the new zip" && exit 1)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: bash app/ci_build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mafx-share-apk
          path: app/build_app/build/app/outputs/flutter-apk/app-release.apk
